<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Periscribe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 상단 고정 영역: 스크롤해도 topbar+헬스바+필터가 항상 보이게 한 덩어리로 고정 -->
  <div class="topstack">
  <header class="topbar">
    <div class="brand">
      <span class="logo">⌖</span> Periscribe
      <span class="tagline">AI 에이전트를 밖에서 관찰·기록</span>
    </div>
    <div class="status">
      <span id="conn-dot" class="dot dot--off"></span>
      <span id="conn-text">연결 대기</span>
      <span id="user-box" class="user-box" style="display:none">
        <span id="user-email" class="user-email"></span>
        <button id="logout" class="btn ghost btn-sm">로그아웃</button>
      </span>
    </div>
  </header>

  <!-- 로그인 게이트: 인증 전엔 이것만 보인다 -->
  <div id="login-gate" class="login-gate">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-title"><span class="logo">⌖</span> Periscribe</div>
      <div class="login-sub">로그인이 필요합니다</div>
      <input id="login-email" type="email" placeholder="이메일" autocomplete="username" required />
      <input id="login-password" type="password" placeholder="비밀번호" autocomplete="current-password" required />
      <button id="login-btn" type="submit" class="btn">로그인</button>
      <button id="forgot-btn" type="button" class="link-btn">비밀번호 재설정 메일 보내기</button>
      <div id="login-error" class="login-error"></div>
      <div id="login-info" class="login-info"></div>
    </form>

    <!-- 비번 재설정 메일 링크로 돌아오면(=recovery 세션) 이 폼이 대신 보인다. -->
    <form id="recovery-form" class="login-card" style="display:none" autocomplete="on">
      <div class="login-title"><span class="logo">⌖</span> 새 비밀번호 설정</div>
      <div class="login-sub">메일 링크로 들어오셨습니다. 새 비밀번호를 입력하세요.</div>
      <input id="new-password" type="password" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password" minlength="6" required />
      <button id="recovery-btn" type="submit" class="btn">비밀번호 변경</button>
      <div id="recovery-error" class="login-error"></div>
    </form>

    <!-- 로그인 없이도 받을 수 있는 공개 다운로드(일반 사용자용). 토큰은 관리자가 따로 전달. -->
    <a class="dl-link" href="https://github.com/qnfw3174/periscribe-dist/releases/latest/download/periscribe.exe">⬇ Collector 설치파일 다운로드 (Windows)</a>
    <div class="dl-note">설치 후 관리자에게 받은 <b>디바이스 토큰</b>을 붙여넣으면 됩니다.</div>
  </div>

  <!-- 머신 헬스(하트비트) 바 -->
  <div id="health-bar" class="health-bar needs-auth">
    <span id="health-chips"></span>
    <button id="manage-devices" class="btn ghost btn-sm">⚙ 머신 관리</button>
  </div>

  <!-- 머신 관리 모달 -->
  <div id="devices-modal" class="modal" style="display:none">
    <div class="modal-card">
      <div class="modal-head">
        <span>머신 관리</span>
        <button id="devices-close" class="btn ghost btn-sm">닫기</button>
      </div>
      <div class="dl-row">
        <a class="btn" href="https://github.com/qnfw3174/periscribe-dist/releases/latest/download/periscribe.exe">⬇ Collector 다운로드 (Windows)</a>
        <span class="dl-hint">실행 → 발급 토큰 붙여넣기 → 끝. (Python 불필요)</span>
        <a class="link-btn" href="https://github.com/qnfw3174/periscribe-dist/releases/latest/download/periscribe-uninstall.bat">🗑 제거 파일 (uninstall.bat)</a>
      </div>
      <form id="add-device-form" class="add-device">
        <input id="device-name" type="text" placeholder="머신 이름 (예: 사무실-PC)" />
        <button class="btn" type="submit">+ 토큰 발급</button>
      </form>
      <div id="token-result" class="token-result" style="display:none"></div>
      <div id="devices-list" class="devices-list"></div>
    </div>
  </div>

  <section class="filters needs-auth">
    <label>머신
      <select id="f-machine"><option value="">전체</option></select>
    </label>
    <label>세션
      <select id="f-session"><option value="">전체</option></select>
    </label>
    <label>종류
      <select id="f-kind">
        <option value="">전체</option>
        <option value="user_prompt">user_prompt</option>
        <option value="assistant_text">assistant_text</option>
        <option value="tool_use">tool_use</option>
        <option value="tool_result">tool_result</option>
      </select>
    </label>
    <label>심각도
      <select id="f-severity">
        <option value="">전체</option>
        <option value="critical">🔴 크리티컬만</option>
        <option value="warn">🟡 경고 이상</option>
      </select>
    </label>
    <label>카테고리
      <select id="f-category"><option value="">전체</option></select>
    </label>
    <label>컨테이너
      <select id="f-container"><option value="">전체</option></select>
    </label>
    <label class="search">검색
      <input id="f-text" type="search" placeholder="명령/텍스트 포함…" />
    </label>
    <label class="chk"><input id="f-errors" type="checkbox" /> 실패만</label>
    <button id="reload" class="btn">다시 로드</button>
    <span id="count" class="count"></span>
  </section>
  </div><!-- /topstack -->

  <div class="loadmore-bar needs-auth">
    <button id="load-more" class="btn ghost" style="display:none">↑ 더 불러오기 (과거)</button>
    <button id="backfill-session" class="btn ghost" style="display:none"
            title="설치 이전 기록은 그 PC 로컬에만 있습니다. 수집 PC가 온라인일 때 받아서 채웁니다.">⟳ 이 세션 과거 전체 불러오기 (수집 PC)</button>
  </div>

  <main id="feed" class="feed needs-auth">
    <div class="empty" id="empty">설정을 확인하는 중…</div>
  </main>

  <!-- Supabase JS (CDN). config.js 는 anon 키만 포함 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
