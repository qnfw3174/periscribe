[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "periscribe-collector"
version = "0.1.0"
description = "Read-only Claude Code transcript collector that ingests into Supabase"
readme = "../README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
# 수집(run) 런타임 의존성 없음 — 표준 라이브러리만 사용.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# GUI 설치 창(더블클릭)에서만 사용. exe 빌드 시 번들된다. 수집 런타임엔 불필요.
gui = ["customtkinter>=5"]

[project.scripts]
periscribe = "periscribe.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["periscribe*"]
